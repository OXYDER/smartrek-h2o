services:
  smartrek-h2o:
    build:
      context: .
    image: smartrek-h2o:latest
    container_name: smartrek-h2o
    restart: unless-stopped
    ports:
      - "8091:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "com.resotik.project=smartrek-h2o"
      - "com.resotik.domain=h2o.resotik.ca"
